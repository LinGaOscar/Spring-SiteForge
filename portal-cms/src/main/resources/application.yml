spring:
  application:
    name: portal-cms
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8200
  servlet:
    context-path: /cms
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

storage:
  upload-dir: ./uploads

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
