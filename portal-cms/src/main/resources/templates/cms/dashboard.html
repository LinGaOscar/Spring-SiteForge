<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Dashboard', ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<main>
    <h5 class="fw-bold mb-4">Dashboard</h5>

    <!-- 統計卡片 -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center py-3">
                <div class="fs-3 fw-bold text-secondary"
                     th:text="${totalPages}">0</div>
                <div class="small text-muted">全部頁面</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center py-3">
                <div class="fs-3 fw-bold text-success"
                     th:text="${stats['PUBLISHED'] ?: 0}">0</div>
                <div class="small text-muted">已發布</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center py-3">
                <div class="fs-3 fw-bold text-warning"
                     th:text="${(stats['PENDING_REVIEW'] ?: 0) + (stats['PENDING_PUBLISH'] ?: 0) + (stats['PENDING_UNPUBLISH'] ?: 0)}">0</div>
                <div class="small text-muted">待審核</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center py-3">
                <div class="fs-3 fw-bold text-primary"
                     th:text="${stats['DRAFT'] ?: 0}">0</div>
                <div class="small text-muted">草稿</div>
            </div>
        </div>
    </div>

    <!-- MA 待處理項目 -->
    <div th:if="${isMA and !pending.isEmpty()}" class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white fw-semibold">
            ⚠️ 待我處理（<span th:text="${pending.size()}">0</span> 件）
        </div>
        <div class="list-group list-group-flush">
            <div class="list-group-item" th:each="p : ${pending}">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <span class="badge me-2"
                              th:classappend="${p.status.name() == 'PENDING_REVIEW'} ? 'bg-warning text-dark' : 'bg-info text-dark'"
                              th:text="${p.status.name()}">狀態</span>
                        <span th:text="${p.title}">標題</span>
                        <span class="text-muted small ms-2" th:text="${p.path}"></span>
                    </div>
                    <div class="d-flex gap-2">
                        <span class="text-muted small"
                              th:text="${p.submittedBy} + ' · ' + ${p.submittedAt != null ? #temporals.format(p.submittedAt,'MM/dd HH:mm') : '—'}"></span>
                        <a th:href="@{/pages(status=${p.status.name()})}"
                           class="btn btn-sm btn-outline-primary">查看</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${pending.isEmpty()}" class="text-muted small">
        目前無待處理項目。
    </div>
</main>
</body>
</html>
