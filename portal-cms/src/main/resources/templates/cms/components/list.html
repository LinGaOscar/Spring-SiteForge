<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('元件管理', ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<main>
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h5 class="fw-bold mb-0">元件管理</h5>
        <div class="d-flex align-items-center gap-3">
            <span class="text-muted small">元件由 portal-web 啟動時自動掃描同步</span>
            <button class="btn btn-outline-secondary btn-sm" onclick="window.location.reload()">↻ 重新整理</button>
        </div>
    </div>

    <!-- 空清單提示 -->
    <div th:if="${#lists.isEmpty(components)}" class="alert alert-warning">
        尚無元件資料，請先啟動 portal-web 讓 ComponentSyncRunner 完成掃描。
    </div>

    <div th:unless="${#lists.isEmpty(components)}" class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>元件 Key</th>
                    <th>類型</th>
                    <th>裝置</th>
                    <th>狀態</th>
                    <th>同步時間</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${components}">
                    <td><code class="text-primary" th:text="${c.key}">key</code></td>
                    <td><span class="badge bg-secondary" th:text="${c.type}">BODY</span></td>
                    <td>
                        <span th:text="${c.deviceMode}"
                              th:classappend="${c.deviceMode == 'RWS'} ? 'badge bg-info text-dark' : 'badge bg-light text-dark border'">RWD</span>
                    </td>
                    <td>
                        <span th:if="${c.active}"     class="badge bg-success">啟用</span>
                        <span th:unless="${c.active}" class="badge bg-danger">停用</span>
                    </td>
                    <td class="small text-muted"
                        th:text="${#temporals.format(c.syncedAt,'MM/dd HH:mm')}"></td>
                    <td>
                        <a th:if="${previewBaseUrl != null and !#strings.isEmpty(previewBaseUrl)}"
                           th:href="${previewBaseUrl + '/preview/component/' + c.key}"
                           target="_blank"
                           class="btn btn-sm btn-outline-secondary py-0">↗ 預覽</a>
                        <span th:unless="${previewBaseUrl != null and !#strings.isEmpty(previewBaseUrl)}"
                              class="text-muted small">未設定 preview-base-url</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
