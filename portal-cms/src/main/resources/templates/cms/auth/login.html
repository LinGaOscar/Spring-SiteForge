<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 — SiteForge CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card shadow" style="width:360px">
        <div class="card-body p-4">
            <h5 class="fw-bold text-center mb-1">🛠 SiteForge CMS</h5>
            <p class="text-muted text-center small mb-4">請登入以繼續</p>

            <div th:if="${param.error}" class="alert alert-danger py-2 small">
                帳號或密碼錯誤，請重試。
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2 small">
                已成功登出。
            </div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">帳號</label>
                    <input type="text" name="username" class="form-control"
                           autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">密碼</label>
                    <input type="password" name="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">登入</button>
            </form>
        </div>
    </div>
</body>
</html>
