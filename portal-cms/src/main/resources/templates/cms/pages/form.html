<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(${page?.id == null ? '新增頁面' : '編輯頁面'}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<main>
    <div class="d-flex align-items-center mb-4 gap-3">
        <a th:href="@{/pages}" class="btn btn-sm btn-outline-secondary">← 返回</a>
        <h5 class="fw-bold mb-0" th:text="${page?.id == null ? '新增頁面' : '編輯頁面：' + page.title}">頁面</h5>
    </div>

    <div class="row g-4 align-items-start">

        <!-- 左欄：基本資訊 + 版面設定 -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="${page?.id == null ? '/pages' : '/pages/' + page.id}"
                          method="post">

                        <h6 class="fw-semibold mb-3">基本資訊</h6>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">路徑 <span class="text-danger">*</span></label>
                            <input type="text" name="path" class="form-control" required
                                   th:value="${page?.path}" placeholder="/about">
                            <div class="form-text">以 / 開頭，例如 /about 或 /products/detail</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">標題 <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" required
                                   th:value="${page?.title}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">SEO 標題</label>
                            <input type="text" name="seoTitle" class="form-control"
                                   th:value="${page?.seoTitle}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">SEO 描述</label>
                            <textarea name="seoDescription" class="form-control" rows="2"
                                      th:text="${page?.seoDescription}"></textarea>
                        </div>

                        <h6 class="fw-semibold mb-3">版面設定</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Header</label>
                                <select name="headerKey" class="form-select">
                                    <option value="">— 不指定 —</option>
                                    <option th:each="k : ${headerKeys}"
                                            th:value="${k.name()}"
                                            th:text="${k.name()}"
                                            th:selected="${page?.layoutSet?.headerKey == k}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Footer</label>
                                <select name="footerKey" class="form-select">
                                    <option value="">— 不指定 —</option>
                                    <option th:each="k : ${footerKeys}"
                                            th:value="${k.name()}"
                                            th:text="${k.name()}"
                                            th:selected="${page?.layoutSet?.footerKey == k}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- 站台（新增時才顯示） -->
                        <div th:if="${page?.id == null}" class="mb-4">
                            <label class="form-label small fw-semibold">站台 <span class="text-danger">*</span></label>
                            <select name="siteId" class="form-select" required>
                                <option th:each="s : ${sites}" th:value="${s.id}"
                                        th:text="${s.name} + ' (' + ${s.domain} + ')'"></option>
                            </select>
                        </div>

                        <!-- 可見單位設定（僅編輯現有頁面時，owner OP 可設定） -->
                        <div th:if="${page?.id != null}" class="mb-4">
                            <h6 class="fw-semibold mb-2">共享設定</h6>
                            <p class="text-muted small mb-2">勾選後，其他單位可查看此頁面（唯讀），不可編輯或操作工作流程。</p>
                            <div th:each="unit : ${allUnits}"
                                 th:if="${!unit.code.equals(page?.unit?.code)}"
                                 class="form-check">
                                <input type="checkbox" class="form-check-input"
                                       name="visibleUnitCodes"
                                       th:value="${unit.code}"
                                       th:id="${'unit-vis-' + unit.code}"
                                       th:checked="${visibleUnitCodes != null and visibleUnitCodes.contains(unit.code)}">
                                <label class="form-check-label small"
                                       th:for="${'unit-vis-' + unit.code}"
                                       th:text="${unit.name + '（' + unit.code + '）'}">單位名稱</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${page?.id == null ? '建立（草稿）' : '儲存'}">送出</span>
                            </button>
                            <a th:href="@{/pages}" class="btn btn-outline-secondary">取消</a>
                            <button th:if="${page?.id != null and previewBaseUrl != null and !#strings.isEmpty(previewBaseUrl)}"
                                    type="button" class="btn btn-outline-info ms-auto"
                                    data-bs-toggle="modal" data-bs-target="#previewModal">
                                預覽
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Audit 資訊 -->
            <div th:if="${page?.id != null}" class="mt-3 text-muted small">
                建立：<span th:text="${page.createdBy}">—</span>
                · <span th:text="${page.createdAt != null ? #temporals.format(page.createdAt,'yyyy/MM/dd HH:mm') : '—'}"></span>
                ｜最後更新：<span th:text="${page.updatedBy}">—</span>
                · <span th:text="${page.updatedAt != null ? #temporals.format(page.updatedAt,'yyyy/MM/dd HH:mm') : '—'}"></span>
            </div>

            <!-- 審核備註 -->
            <div th:if="${page?.id != null and page?.reviewNote != null}" class="mt-3">
                <div class="alert alert-warning py-2 small">
                    <strong>上次審核備註：</strong>
                    <span th:text="${page.reviewNote}"></span>
                </div>
            </div>
        </div>

        <!-- 右欄：Body 區塊（僅編輯模式） -->
        <div th:if="${page?.id != null}" class="col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white d-flex align-items-center justify-content-between py-2">
                    <span class="fw-semibold small">Body 區塊</span>
                    <span class="badge bg-secondary" th:text="${pageContents?.size() ?: 0}">0</span>
                </div>
                <div class="card-body p-3">

                    <!-- 現有區塊列表 -->
                    <div th:if="${pageContents == null or pageContents.empty}"
                         class="text-center text-muted small py-3">尚未加入任何 Body 區塊</div>

                    <div th:each="c, stat : ${pageContents}"
                         class="d-flex align-items-center gap-2 p-2 mb-1 border rounded bg-light">
                        <span class="badge bg-secondary" th:text="${stat.index + 1}">1</span>
                        <span class="small font-monospace flex-grow-1" th:text="${c.blockKey}">rwd_body_01</span>
                        <form th:action="@{/pages/{pid}/content/{cid}/delete(pid=${page.id},cid=${c.id})}"
                              method="post"
                              onsubmit="return confirm('移除此區塊？')">
                            <button class="btn btn-xs btn-outline-danger btn-sm py-0 px-1">✕</button>
                        </form>
                    </div>

                    <hr class="my-3">

                    <!-- 新增 Body 區塊 -->
                    <form th:action="@{/pages/{pid}/content(pid=${page.id})}" method="post">
                        <label class="form-label small fw-semibold">新增 Body 模板</label>
                        <!-- portal-web 尚未啟動掃描時，bodyKeys 為空，提示使用者 -->
                        <div th:if="${bodyKeys == null or #lists.isEmpty(bodyKeys)}"
                             class="alert alert-warning py-2 small mb-2">
                            元件清單尚未同步，請先啟動 portal-web 完成掃描。
                        </div>
                        <div class="d-flex gap-2">
                            <select name="blockKey" class="form-select form-select-sm" required>
                                <option th:each="k : ${bodyKeys}"
                                        th:value="${k.key}"
                                        th:text="${#strings.toUpperCase(k.key)}">RWD_BODY_01</option>
                            </select>
                            <input type="hidden" name="sortOrder"
                                   th:value="${pageContents != null ? pageContents.size() : 0}">
                            <input type="hidden" name="contentJson" value="{}">
                            <button type="submit" class="btn btn-sm btn-primary text-nowrap">+ 加入</button>
                        </div>
                        <div class="form-text">區塊依加入順序由上至下顯示</div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 預覽 Modal（僅編輯模式且有設定 previewBaseUrl 時顯示） -->
    <div th:if="${page?.id != null and previewBaseUrl != null and !#strings.isEmpty(previewBaseUrl)}"
         class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title" id="previewModalLabel">
                        頁面預覽
                        <small class="text-muted ms-2 fw-normal" th:text="'（' + ${page.title} + '）'"></small>
                    </h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe th:src="${previewBaseUrl + '/preview/' + page.id}"
                            style="width:100%; height:80vh; border:none;" title="頁面預覽"></iframe>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
