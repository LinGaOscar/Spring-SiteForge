<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — SiteForge CMS'">SiteForge CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cms-sidebar { width: 220px; min-height: 100vh; background: #1e2330; }
        .cms-sidebar .nav-link { color: #adb5bd; padding: .6rem 1.25rem; border-radius: 6px; }
        .cms-sidebar .nav-link:hover, .cms-sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.08); }
        .cms-sidebar .nav-link .bi { margin-right: .5rem; }
        .cms-main { flex: 1; min-height: 100vh; background: #f8f9fa; }
        .cms-topbar { background: #fff; border-bottom: 1px solid #dee2e6; padding: .75rem 1.5rem; }
        .status-badge { font-size: .7rem; }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <nav class="cms-sidebar d-flex flex-column p-3">
        <div class="text-white fw-bold fs-6 mb-4 px-2">
            🛠 SiteForge CMS
        </div>
        <ul class="nav flex-column gap-1 flex-grow-1">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/dashboard}"
                   th:classappend="${currentUri.contains('/dashboard')} ? 'active'">
                    📊 Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/pages}"
                   th:classappend="${currentUri.contains('/pages')} ? 'active'">
                    📄 頁面管理
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/components}"
                   th:classappend="${currentUri.contains('/components')} ? 'active'">
                    🧩 元件管理
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/assets}"
                   th:classappend="${currentUri.contains('/assets')} ? 'active'">
                    🖼 素材管理
                </a>
            </li>
        </ul>
        <div class="border-top border-secondary pt-3 mt-3">
            <div class="text-white-50 small mb-1" sec:authentication="name">user</div>
            <div class="text-white-50 small mb-2"
                 th:text="${actor?.unit?.name ?: '—'}">單位</div>
            <form th:action="@{/auth/logout}" method="post">
                <button class="btn btn-sm btn-outline-secondary w-100 text-white-50">登出</button>
            </form>
        </div>
    </nav>

    <!-- Main -->
    <div class="cms-main d-flex flex-column">
        <!-- Flash messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible m-3 mb-0 py-2"
             th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible m-3 mb-0 py-2"
             th:text="${error}"></div>

        <!-- Page content -->
        <div class="p-4 flex-grow-1">
            <th:block th:replace="${content}"/>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
