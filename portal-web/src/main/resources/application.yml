spring:
  application:
    name: portal-web
  jpa:
    open-in-view: false
  cache:
    # 目前無 @Cacheable 使用，改用 ConcurrentHashMap 避免強制依賴 Redis 才能啟動
    # 待 Plan 2 實作頁面快取後再切回 redis
    type: simple

server:
  port: 8100

# CMS base URL：Dev 環境需指向 portal-cms (8200)；Docker 環境透過 Nginx 設為空字串即可
cms:
  asset-base-url: ""

portal:
  site-id: 1
