<header th:fragment="header(config)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5" th:href="@{/}">SpringSiteForge</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navMain"
                    aria-controls="navMain" aria-expanded="false" aria-label="開啟選單">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/about}">關於我們</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/services}">服務項目</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contact}">聯絡我們</a></li>
                </ul>
            </div>
        </div>
    </nav>
