<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<footer th:fragment="footer(config)" class="bg-dark text-light pt-5 pb-3 mt-auto">
    <div class="container">
        <div class="row g-4 mb-4">
            <!-- 品牌介紹 -->
            <div class="col-12 col-md-4">
                <h6 class="fw-bold mb-3 text-white">SpringSiteForge</h6>
                <p class="text-secondary small lh-lg">
                    專注於提供企業級官網解決方案，<br>
                    結合現代技術與優質內容管理系統，<br>
                    打造高效、穩定的數位品牌形象。
                </p>
            </div>
            <!-- 快速連結 -->
            <div class="col-6 col-md-4">
                <h6 class="fw-semibold mb-3 text-white">快速連結</h6>
                <ul class="list-unstyled small">
                    <li class="mb-2"><a th:href="@{/}" class="text-secondary text-decoration-none link-hover">首頁</a></li>
                    <li class="mb-2"><a th:href="@{/about}" class="text-secondary text-decoration-none">關於我們</a></li>
                    <li class="mb-2"><a th:href="@{/services}" class="text-secondary text-decoration-none">服務項目</a></li>
                    <li class="mb-2"><a th:href="@{/contact}" class="text-secondary text-decoration-none">聯絡我們</a></li>
                </ul>
            </div>
            <!-- 聯絡資訊 -->
            <div class="col-6 col-md-4">
                <h6 class="fw-semibold mb-3 text-white">聯絡資訊</h6>
                <ul class="list-unstyled small text-secondary">
                    <li class="mb-2">📍 台北市信義區信義路五段 7 號</li>
                    <li class="mb-2">📞 (02) 1234-5678</li>
                    <li class="mb-2">✉️ info@siteforge.example.com</li>
                    <li class="mb-2">🕘 週一至週五 09:00 – 18:00</li>
                </ul>
            </div>
        </div>
        <hr class="border-secondary">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <p class="small text-secondary mb-0">
                &copy; 2025 SpringSiteForge. 保留所有權利。
            </p>
            <div class="d-flex gap-3">
                <a href="#" class="text-secondary small text-decoration-none">隱私政策</a>
                <a href="#" class="text-secondary small text-decoration-none">服務條款</a>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
