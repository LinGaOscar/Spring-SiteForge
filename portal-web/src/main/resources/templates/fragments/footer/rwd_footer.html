<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<footer th:fragment="footer(config)">
    <div class="bg-dark text-white pt-5 pb-3 mt-auto">
        <div class="container">
            <div class="row g-4">
                <div class="col-12 col-lg-4">
                    <h5 class="fw-bold mb-2">SpringSiteForge</h5>
                    <p class="text-white-50 small mb-0">企業官網 CMS 平台，提供完整的內容管理解決方案。</p>
                </div>
                <div class="col-6 col-lg-4">
                    <h6 class="fw-semibold mb-3">快速連結</h6>
                    <ul class="list-unstyled small mb-0">
                        <li class="mb-1"><a class="text-white-50 text-decoration-none" th:href="@{/}">首頁</a></li>
                        <li class="mb-1"><a class="text-white-50 text-decoration-none" th:href="@{/about}">關於我們</a></li>
                        <li class="mb-1"><a class="text-white-50 text-decoration-none" th:href="@{/services}">服務項目</a></li>
                        <li class="mb-1"><a class="text-white-50 text-decoration-none" th:href="@{/contact}">聯絡我們</a></li>
                    </ul>
                </div>
                <div class="col-6 col-lg-4">
                    <h6 class="fw-semibold mb-3">聯絡資訊</h6>
                    <ul class="list-unstyled small text-white-50 mb-0">
                        <li class="mb-1">📧 contact@example.com</li>
                        <li class="mb-1">📞 02-1234-5678</li>
                        <li class="mb-1">📍 台北市信義區</li>
                    </ul>
                </div>
            </div>
            <hr class="border-secondary mt-4 mb-3">
            <p class="text-center text-white-50 small mb-0">
                &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span>
                SpringSiteForge. All rights reserved.
            </p>
        </div>
    </div>
</footer>
</body>
</html>
