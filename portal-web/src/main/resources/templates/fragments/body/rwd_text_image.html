<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--@component-schema
{
  "deviceMode": "RWD",
  "fields": [
    {"name": "badge",         "type": "text",     "label": "標籤（選填）",          "default": ""},
    {"name": "title",         "type": "text",     "label": "標題",                 "default": "我們的故事"},
    {"name": "body",          "type": "richtext", "label": "內文",                 "default": "<p>請在 CMS 填寫此段落內容。</p>"},
    {"name": "imageUrl",      "type": "text",     "label": "圖片 URL",             "default": ""},
    {"name": "imageAlt",      "type": "text",     "label": "圖片替代文字",          "default": ""},
    {"name": "imagePosition", "type": "text",     "label": "圖片位置（left/right）", "default": "right"}
  ]
}
@end-component-schema-->
<div th:fragment="body(config)">
    <section class="py-6" style="padding-top:5rem;padding-bottom:5rem;">
        <div class="container">
            <div class="row align-items-center g-5"
                 th:classappend="${(config['imagePosition'] ?: 'right') == 'left'} ? 'flex-row-reverse' : ''">
                <!-- 文字欄 -->
                <div class="col-12 col-md-6">
                    <span th:if="${config['badge'] != null and !#strings.isEmpty(config['badge'])}"
                          th:text="${config['badge']}"
                          class="badge bg-primary mb-3"></span>
                    <h2 class="fw-bold mb-4"
                        th:text="${config['title'] ?: '我們的故事'}">我們的故事</h2>
                    <div class="text-muted lh-lg"
                         th:utext="${config['body'] ?: '<p>請在 CMS 填寫此段落內容。</p>'}">
                        <p>請在 CMS 填寫此段落內容。</p>
                    </div>
                </div>
                <!-- 圖片欄 -->
                <div class="col-12 col-md-6">
                    <img th:if="${config['imageUrl'] != null and !#strings.isEmpty(config['imageUrl'])}"
                         th:src="${config['imageUrl']}"
                         th:alt="${config['imageAlt'] ?: ''}"
                         class="img-fluid rounded-4 shadow-sm w-100">
                    <div th:unless="${config['imageUrl'] != null and !#strings.isEmpty(config['imageUrl'])}"
                         class="bg-light rounded-4 d-flex align-items-center justify-content-center"
                         style="height:320px">
                        <span class="text-muted small">尚未設定圖片（填寫圖片 URL）</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
