<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page?.seoTitle ?: page?.title ?: 'SpringSiteForge'}">SpringSiteForge</title>
    <meta name="description" th:if="${page?.seoDescription}" th:content="${page.seoDescription}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header/__${layoutSet?.headerKey ?: 'rwd_header'}__ :: header}"></div>

    <main>
        <div th:replace="~{fragments/body/__${layoutSet?.bodyKey ?: 'rwd_body'}__ :: body}"></div>
    </main>

    <div th:replace="~{fragments/footer/__${layoutSet?.footerKey ?: 'rwd_footer'}__ :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</body>
</html>
