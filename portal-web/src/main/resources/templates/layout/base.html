<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page?.seoTitle ?: page?.title ?: 'SpringSiteForge'}">SpringSiteForge</title>
    <meta name="description" th:if="${page?.seoDescription}" th:content="${page.seoDescription}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header/__${headerTemplate}__ :: header(config=${headerConfig})}"></div>

    <main>
        <th:block th:each="block : ${pageContents}">
            <div th:replace="~{fragments/body/__${block.blockKey}__ :: body(config=${block.contentMap})}"></div>
        </th:block>
    </main>

    <div th:replace="~{fragments/footer/__${footerTemplate}__ :: footer(config=${footerConfig})}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</body>
</html>
