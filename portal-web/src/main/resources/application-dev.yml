spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/siteforge_db
    username: siteforge
    password: siteforge
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: localhost

# Dev 環境：portal-cms 跑在 8200，瀏覽器無法直接存取 /uploads/**（需前綴）
cms:
  asset-base-url: "http://localhost:8200"
