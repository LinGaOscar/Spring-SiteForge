server {
    listen 80;
    server_name _;

    # 企業靜態資源（logo、banner 等上傳圖片）統一由 CMS 提供
    location /uploads/ {
        proxy_pass         http://portal-cms:8200;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # CMS REST API
    location /api/cms/ {
        proxy_pass         http://portal-cms:8200;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前台（預設流量）
    location / {
        proxy_pass         http://portal-web:8100;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
